# Instalador con la estética de Rust Sonar. Lleva dentro el instalador de Inno Setup (que hace el
# trabajo: archivos, desinstalador, accesos directos, drivers) y lo ejecuta en modo invisible
# mostrando su propio asistente y el progreso. Se compila con installer\build.ps1, que le pasa la
# ruta del instalador interno en RUST_SONAR_PAYLOAD.
[package]
name = "rust_sonar_setup"
version = "0.2.1"
edition = "2024"
publish = false

[dependencies]
eframe = "0.37.0"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Registry", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Globalization"] }

[build-dependencies]
winresource = "0.1.34"

[profile.release]
lto = "thin"
