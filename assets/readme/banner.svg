<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-label="Rust Sonar — per-channel audio mixer for Windows">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#11151c"/>
      <stop offset="1" stop-color="#0b0d11"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.2" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <style>
      .t { font-family: Inter, "Segoe UI", system-ui, -apple-system, sans-serif; }
      .bar { transform-box: fill-box; transform-origin: 50% 100%; animation: eq 1.6s ease-in-out infinite alternate; }
      .logo { transform-box: fill-box; transform-origin: 50% 50%; animation: pulse 1.2s ease-in-out infinite alternate; }
      @keyframes eq { from { transform: scaleY(0.25); } to { transform: scaleY(1); } }
      @keyframes pulse { from { transform: scaleY(0.55); } to { transform: scaleY(1); } }
      @media (prefers-reduced-motion: reduce) { .bar, .logo { animation: none; } }
    </style>
  </defs>

  <rect width="1280" height="300" rx="28" fill="url(#bg)"/>
  <rect width="1280" height="300" rx="28" fill="url(#glow)"/>
  <rect x="1" y="1" width="1278" height="298" rx="27" fill="none" stroke="#242a34" stroke-width="2"/>

  <!-- logo: ring + three bars (same drawing as the app icon) -->
  <g transform="translate(150 150)">
    <circle r="72" fill="#2dd4bf" fill-opacity="0.12"/>
    <circle r="64" fill="none" stroke="#2dd4bf" stroke-width="11"/>
    <rect class="logo" x="-30" y="-22" width="12" height="44" rx="6" fill="#2dd4bf" style="animation-delay:-0.3s"/>
    <rect class="logo" x="-6" y="-40" width="12" height="80" rx="6" fill="#2dd4bf"/>
    <rect class="logo" x="18" y="-29" width="12" height="58" rx="6" fill="#2dd4bf" style="animation-delay:-0.7s"/>
  </g>

  <text class="t" x="262" y="138" font-size="64" font-weight="700" fill="#e6e9ef">Rust Sonar</text>
  <text class="t" x="264" y="182" font-size="24" fill="#9aa3b2">Per-channel audio mixer for Windows · written in Rust</text>
  <text class="t" x="264" y="222" font-size="18" fill="#677080">Game · Chat · Media · Aux · AI mic · parametric EQ · spatial audio · ~5 MB in the tray</text>

  <!-- channel meters -->
  <g transform="translate(1000 70)">
    <rect x="0"   y="0" width="22" height="160" rx="11" fill="#1c212a"/>
    <rect x="44"  y="0" width="22" height="160" rx="11" fill="#1c212a"/>
    <rect x="88"  y="0" width="22" height="160" rx="11" fill="#1c212a"/>
    <rect x="132" y="0" width="22" height="160" rx="11" fill="#1c212a"/>
    <rect x="176" y="0" width="22" height="160" rx="11" fill="#1c212a"/>
    <rect class="bar" x="0"   y="20" width="22" height="140" rx="11" fill="#84cc16" style="animation-duration:1.3s"/>
    <rect class="bar" x="44"  y="40" width="22" height="120" rx="11" fill="#38bdf8" style="animation-duration:1.7s;animation-delay:-0.4s"/>
    <rect class="bar" x="88"  y="10" width="22" height="150" rx="11" fill="#fbbf24" style="animation-duration:1.1s;animation-delay:-0.8s"/>
    <rect class="bar" x="132" y="55" width="22" height="105" rx="11" fill="#a78bfa" style="animation-duration:1.9s;animation-delay:-0.2s"/>
    <rect class="bar" x="176" y="30" width="22" height="130" rx="11" fill="#f472b6" style="animation-duration:1.5s;animation-delay:-1s"/>
    <text class="t" x="11"  y="190" font-size="13" fill="#677080" text-anchor="middle">GAME</text>
    <text class="t" x="55"  y="190" font-size="13" fill="#677080" text-anchor="middle">CHAT</text>
    <text class="t" x="99"  y="190" font-size="13" fill="#677080" text-anchor="middle">MEDIA</text>
    <text class="t" x="143" y="190" font-size="13" fill="#677080" text-anchor="middle">AUX</text>
    <text class="t" x="187" y="190" font-size="13" fill="#677080" text-anchor="middle">MIC</text>
  </g>
</svg>
